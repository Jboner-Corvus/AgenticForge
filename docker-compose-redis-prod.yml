version: '3.8'

services:
  redis-prod:
    image: redis:7.2-alpine
    container_name: gforge_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - gforge-network

  redis-backup:
    image: redis:7.2-alpine
    container_name: gforge_redis_backup
    depends_on:
      redis-prod:
        condition: service_healthy
    volumes:
      - redis_backup:/backup
      - ./scripts/backup-redis.sh:/backup.sh:ro
    command: sh /backup.sh
    restart: "no"

volumes:
  redis_data:
    driver: local
  redis_backup:
    driver: local

networks:
  gforge-network:
    driver: bridge