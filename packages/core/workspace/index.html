<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .product { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; }
        .product img { width: 100px; height: 100px; margin-right: 15px; object-fit: cover; }
        .product-details { flex-grow: 1; }
        .product-details h3 { margin: 0 0 5px 0; }
        .product-details p { margin: 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        #cart { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; }
        #checkout-form { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; }
        #checkout-form label { display: block; margin-bottom: 5px; }
        #checkout-form input { width: 300px; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #checkout-form button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #checkout-form button:hover { background-color: #0056b3; }
        .error-message { color: red; font-size: 0.9em; margin-top: -8px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <h1>Our Products</h1>

    <div id="products">
        <div class="product" data-id="1" data-name="Stylish T-Shirt" data-price="25.00">
            <img src="https://via.placeholder.com/100/FF5733/FFFFFF?text=T-Shirt" alt="Stylish T-Shirt">
            <div class="product-details">
                <h3>Stylish T-Shirt</h3>
                <p>$25.00</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product" data-id="2" data-name="Cool Jeans" data-price="50.00">
            <img src="https://via.placeholder.com/100/33FF57/FFFFFF?text=Jeans" alt="Cool Jeans">
            <div class="product-details">
                <h3>Cool Jeans</h3>
                <p>$50.00</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product" data-id="3" data-name="Fancy Sneakers" data-price="80.00">
            <img src="https://via.placeholder.com/100/3357FF/FFFFFF?text=Sneakers" alt="Fancy Sneakers">
            <div class="product-details">
                <h3>Fancy Sneakers</h3>
                <p>$80.00</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </div>

    <div id="cart">
        <h2>Shopping Cart (<span id="cart-count">0</span>)</h2>
        <div id="cart-items"></div>
        <p>Total: $<span id="cart-total">0.00</span></p>
        <button id="clear-cart" style="display: none;">Clear Cart</button>
        <button id="proceed-to-checkout" style="display: none;">Proceed to Checkout</button>
    </div>

    <div id="checkout-form" style="display: none;">
        <h2>Checkout</h2>
        <form id="order-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <div class="error-message" id="name-error">Please enter your full name.</div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <div class="error-message" id="email-error">Please enter a valid email address.</div>

            <label for="address">Shipping Address:</label>
            <input type="text" id="address" name="address" required>
            <div class="error-message" id="address-error">Please enter your shipping address.</div>

            <button type="submit" id="place-order">Place Order</button>
        </form>
        <div id="order-confirmation" style="display: none; color: green; margin-top: 15px;">
            Thank you for your order! Your order has been placed successfully.
        </div>
    </div>

    <script>
        let cart = [];

        const productsDiv = document.getElementById('products');
        const cartItemsDiv = document.getElementById('cart-items');
        const cartCountSpan = document.getElementById('cart-count');
        const cartTotalSpan = document.getElementById('cart-total');
        const clearCartButton = document.getElementById('clear-cart');
        const proceedToCheckoutButton = document.getElementById('proceed-to-checkout');
        const checkoutFormDiv = document.getElementById('checkout-form');
        const orderForm = document.getElementById('order-form');
        const orderConfirmationDiv = document.getElementById('order-confirmation');

        function updateCartDisplay() {
            cartItemsDiv.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const cartItemDiv = document.createElement('div');
                cartItemDiv.classList.add('cart-item');
                cartItemDiv.innerHTML = `
                    <span>${item.name} (x${item.quantity})</span>
                    <span>$${(item.price * item.quantity).toFixed(2)}</span>
                `;
                cartItemsDiv.appendChild(cartItemDiv);
                total += item.price * item.quantity;
            });
            cartCountSpan.textContent = cart.length;
            cartTotalSpan.textContent = total.toFixed(2);

            if (cart.length > 0) {
                clearCartButton.style.display = 'inline-block';
                proceedToCheckoutButton.style.display = 'inline-block';
            } else {
                clearCartButton.style.display = 'none';
                proceedToCheckoutButton.style.display = 'none';
                checkoutFormDiv.style.display = 'none';
                orderConfirmationDiv.style.display = 'none';
            }
        }

        productsDiv.addEventListener('click', (e) => {
            if (e.target.classList.contains('add-to-cart')) {
                const productDiv = e.target.closest('.product');
                const id = productDiv.dataset.id;
                const name = productDiv.dataset.name;
                const price = parseFloat(productDiv.dataset.price);

                const existingItem = cart.find(item => item.id === id);
                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    cart.push({ id, name, price, quantity: 1 });
                }
                updateCartDisplay();
            }
        });

        clearCartButton.addEventListener('click', () => {
            cart = [];
            updateCartDisplay();
        });

        proceedToCheckoutButton.addEventListener('click', () => {
            checkoutFormDiv.style.display = 'block';
            orderConfirmationDiv.style.display = 'none';
        });

        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            // Name validation
            const nameInput = document.getElementById('name');
            if (nameInput.value.trim() === '') {
                document.getElementById('name-error').style.display = 'block';
                isValid = false;
            }

            // Email validation
            const emailInput = document.getElementById('email');
            const emailPattern = /^[\w-]+(\.[\w-]+)*@[\w-]+(\.[\w-]+)+$/;
            if (!emailPattern.test(emailInput.value.trim())) {
                document.getElementById('email-error').style.display = 'block';
                isValid = false;
            }

            // Address validation
            const addressInput = document.getElementById('address');
            if (addressInput.value.trim() === '') {
                document.getElementById('address-error').style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                // Simulate order placement
                console.log('Order Placed!', { cart, name: nameInput.value, email: emailInput.value, address: addressInput.value });
                orderConfirmationDiv.style.display = 'block';
                cart = []; // Clear cart after successful order
                updateCartDisplay();
                orderForm.reset(); // Reset form fields
                checkoutFormDiv.style.display = 'none'; // Hide checkout form
            } else {
                orderConfirmationDiv.style.display = 'none';
            }
        });

        updateCartDisplay(); // Initial display
    </script>
</body>
</html>
