<!doctype html>
<html>
  <head>
    <title>Analyse Technique Statique</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background-color: #131722;
        color: #d1d4dc;
        margin: 0;
      }
      #chart-container {
        width: 100%;
        height: 95vh;
      }
      h1 {
        text-align: center;
        padding: 10px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Analyse Statique (Exemple) - Support & Résistance</h1>
    <div id="chart-container"></div>
    <script>
      const chartContainer = document.getElementById('chart-container');
      const chart = LightweightCharts.createChart(chartContainer, {
        width: chartContainer.clientWidth,
        height: chartContainer.clientHeight,
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: {
          vertLines: { color: '#334158' },
          horzLines: { color: '#334158' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#485c7b' },
        timeScale: { borderColor: '#485c7b' },
      });

      const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderDownColor: '#ef5350',
        borderUpColor: '#26a69a',
        wickDownColor: '#ef5350',
        wickUpColor: '#26a69a',
      });

      // Données statiques de bougies
      const staticData = [
        { time: '2023-11-01', open: 160, high: 165, low: 158, close: 163 },
        { time: '2023-11-02', open: 163, high: 170, low: 162, close: 168 },
        { time: '2023-11-03', open: 168, high: 169, low: 163, close: 165 },
        { time: '2023-11-04', open: 165, high: 168, low: 160, close: 161 },
        { time: '2023-11-05', open: 161, high: 164, low: 159, close: 162 },
        { time: '2023-11-06', open: 162, high: 172, low: 161, close: 170 },
        { time: '2023-11-07', open: 170, high: 175, low: 169, close: 174 },
        { time: '2023-11-08', open: 174, high: 176, low: 171, close: 172 },
        { time: '2023-11-09', open: 172, high: 174, low: 168, close: 169 },
        { time: '2023-11-10', open: 169, high: 171, low: 160, close: 162 },
        { time: '2023-11-11', open: 162, high: 165, low: 158, close: 163 },
        { time: '2023-11-12', open: 163, high: 175, low: 163, close: 172 },
      ];
      candleSeries.setData(staticData);

      // Lignes de support et résistance
      const resistancePrice = 175.5;
      const supportPrice = 158.5;

      const resistanceLine = {
        price: resistancePrice,
        color: '#ef5350',
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: 'Résistance',
      };
      const supportLine = {
        price: supportPrice,
        color: '#26a69a',
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: 'Support',
      };

      candleSeries.createPriceLine(resistanceLine);
      candleSeries.createPriceLine(supportLine);

      chart.timeScale().fitContent();

      window.addEventListener('resize', () => {
        chart.resize(chartContainer.clientWidth, chartContainer.clientHeight);
      });
    </script>
  </body>
</html>
