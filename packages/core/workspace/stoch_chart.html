        const dates = Object.keys(stochData).reverse();
        const slowK = dates.map(date => stochData[date].SlowK);
        const slowD = dates.map(date => stochData[date].SlowD);

        const ctx = document.getElementById('stochChart').getContext('2d');
        const stochChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: '%K',
                        data: slowK,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1,
                        fill: false
                    },
                    {
                        label: '%D',
                        data: slowD,
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1,
                        fill: false
                    }
                ]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    </script>
</body>
